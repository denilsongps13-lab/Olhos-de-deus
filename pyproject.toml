[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "olhos-de-deus"
version = "0.7.0"
description = "Central modular de agentes, workflows, QA e automacao do Olho de Deus"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]
desktop = ["PySide6>=6.8,<7"]
build = ["pyinstaller>=6.11", "pillow>=11.0"]

[project.scripts]
olhos-de-deus = "olhos_de_deus.cli:main"
olhos-de-deus-desktop = "olhos_de_deus.desktop.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
