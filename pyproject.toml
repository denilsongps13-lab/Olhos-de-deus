[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "olhos-de-deus"
version = "0.4.0"
description = "Orquestrador modular de agentes, workflows e verificacao do Olhos de Deus"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
olhos-de-deus = "olhos_de_deus.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
