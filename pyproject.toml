[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "olhos-de-deus"
version = "0.7.2"
description = "Olho de Deus desktop application"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]
desktop = ["PySide6>=6.8,<7"]
build = ["pyinstaller>=6.11", "pillow>=11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
